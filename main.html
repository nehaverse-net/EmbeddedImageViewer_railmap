<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路線図ビューア</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
    }
    #viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>
  <script>
    OpenSeadragon({
      id: "viewer",
      prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
      tileSources: {
        type: "image",
        url: "./railmap.png"
      },
      showNavigator: true,
      animationTime: 0.8,
      blendTime: 0.1,
      minZoomLevel: 0.5,
      maxZoomPixelRatio: 2,
      zoomPerScroll: 1.2
    });
  </script>
</body>
</html>
